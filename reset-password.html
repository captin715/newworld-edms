<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>뉴월드 EDMS — 새 비밀번호 정하기</title>
<!-- 비밀번호 재설정 메일의 링크가 돌아오는 화면(MST2-20261021-510).
     ★이 주소는 인증 설정의 돌아올 주소 허용 목록에 있어야 함. 꼴은 login.html 과 같게. -->
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Malgun Gothic','Segoe UI',sans-serif; }
  body {
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:linear-gradient(135deg,#1F3864 0%,#2d4f8a 100%); padding:16px;
  }
  .card {
    background:#fff; border-radius:14px; padding:40px 32px; width:100%; max-width:400px;
    box-shadow:0 12px 40px rgba(0,0,0,.25);
  }
  .logo { text-align:center; margin-bottom:24px; }
  .logo .badge {
    display:inline-block; background:#1F3864; color:#fff; font-size:13px;
    padding:4px 12px; border-radius:20px; letter-spacing:2px; margin-bottom:10px;
  }
  .logo h1 { font-size:22px; color:#1F3864; }
  .logo p { font-size:15px; color:#666; margin-top:6px; }
  label { display:block; font-size:15px; color:#444; margin:14px 0 6px; font-weight:bold; }
  input {
    width:100%; padding:12px 14px; border:1.5px solid #d5dbe7; border-radius:8px;
    font-size:16px; outline:none;
  }
  input:focus { border-color:#1F3864; }
  .note { font-size:15px; color:#666; margin-top:8px; line-height:1.5; }
  button, .go {
    display:block; width:100%; margin-top:22px; padding:13px; background:#1F3864; color:#fff; text-align:center;
    border:none; border-radius:8px; font-size:16px; font-weight:bold; cursor:pointer; text-decoration:none;
  }
  button:hover, .go:hover { background:#16294a; }
  button:disabled { background:#9aa7bd; cursor:wait; }
  .msg { margin-top:14px; font-size:15px; text-align:center; min-height:20px; line-height:1.5; }
  .msg.error { color:#c62828; }
  .msg.ok { color:#2e7d32; }
  .msg.wait { color:#e65100; }
  [hidden] { display:none !important; }
  .foot { margin-top:24px; text-align:center; font-size:12px; color:#aaa; }
</style>
<script>
  // 메일 링크의 열쇠 글(# 뒤)을 인증 라이브러리가 읽고 지우기 전에 먼저 잡아 둠
  window.EDMS_RESET_HASH = location.hash;
  window.EDMS_RESET_QUERY = location.search;
</script>
</head>
<body>
  <div class="card">
    <div class="logo">
      <span class="badge">NEW WORLD</span>
      <h1>새 비밀번호 정하기</h1>
      <p>뉴월드 EDMS</p>
    </div>

    <div id="checking" class="msg wait">⏸ 메일 링크를 확인하는 중입니다...</div>

    <form id="resetForm" hidden>
      <label for="pw1">새 비밀번호</label>
      <input type="password" id="pw1" autocomplete="new-password" required placeholder="새 비밀번호">
      <label for="pw2">새 비밀번호 한 번 더</label>
      <input type="password" id="pw2" autocomplete="new-password" required placeholder="같은 비밀번호를 한 번 더">
      <div class="note">8자 이상으로 넣으십시오. 영문과 숫자를 섞으면 더 안전합니다.</div>
      <button type="submit" id="btn">새 비밀번호로 바꾸기</button>
    </form>

    <div class="msg" id="msg"></div>
    <a class="go" id="toLogin" href="login.html" hidden>로그인 화면으로</a>
    <div class="foot">© 주식회사 뉴월드</div>
  </div>

<script src="assets/vendor/supabase.js"></script>
<script src="edms-config.js"></script>
<script>
  const msg = document.getElementById('msg');
  const form = document.getElementById('resetForm');
  const toLogin = document.getElementById('toLogin');
  const say = (text, kind) => { msg.textContent = text; msg.className = 'msg' + (kind ? ' ' + kind : ''); };
  const cleanAddress = () => history.replaceState(null, '', location.pathname);

  // 링크가 지났거나 · 이미 썼거나 · 메일 없이 바로 연 경우 — 다시 받는 길만 보여 줌
  function showDead(text) {
    cleanAddress();
    document.getElementById('checking').hidden = true;
    form.hidden = true;
    say(text, 'error');
    toLogin.textContent = '로그인 화면에서 비밀번호 재설정 다시 누르기';
    toLogin.hidden = false;
  }
  function showForm() {
    document.getElementById('checking').hidden = true;
    form.hidden = false;
    document.getElementById('pw1').focus();
  }

  // 재설정 링크로 만든 세션인지 — 이미 로그인한 브라우저에 가짜 # 글을 붙여 여는 것을 막음
  let recovered = false;
  edmsClient.auth.onAuthStateChange((ev) => { if (ev === 'PASSWORD_RECOVERY') recovered = true; });

  (async () => {
    const hash = new URLSearchParams((window.EDMS_RESET_HASH || '').replace(/^#/, ''));
    const query = new URLSearchParams(window.EDMS_RESET_QUERY || '');
    if (hash.get('error') || hash.get('error_code') || query.get('error')) {
      return showDead('⚠ 메일 링크가 지났거나 이미 쓰였습니다. 로그인 화면에서 비밀번호 재설정을 다시 누르십시오.');
    }
    const fromMail = (hash.get('type') === 'recovery' && hash.get('access_token')) || query.get('code');
    if (!fromMail) {
      return showDead('⚠ 이 화면은 비밀번호 재설정 메일의 링크로만 열립니다. 로그인 화면에서 비밀번호 재설정을 누르십시오.');
    }
    let { data } = await edmsClient.auth.getSession();          // 라이브러리가 링크를 읽어 세션을 만들었는지
    cleanAddress();                                             // 주소 칸 · 방문 기록에 열쇠 글을 남기지 않음
    if (!data.session && hash.get('access_token')) {           // 라이브러리가 링크를 읽지 않게 설정된 경우의 대비 길
      const r = await edmsClient.auth.setSession({
        access_token: hash.get('access_token'), refresh_token: hash.get('refresh_token') || '' });
      data = { session: r.data && r.data.session };
    }
    if (!recovered) await new Promise(r => setTimeout(r, 100));  // 라이브러리가 알림을 조금 늦게 낼 때
    const s = data.session;
    if (!s || !(recovered || (hash.get('access_token') && s.access_token === hash.get('access_token')))) {
      return showDead(query.get('code')
        ? '⚠ 메일 링크를 확인하지 못했습니다. 재설정을 누른 그 브라우저에서 링크를 여시거나, 비밀번호 재설정을 다시 누르십시오.'
        : '⚠ 메일 링크가 지났거나 이미 쓰였습니다. 로그인 화면에서 비밀번호 재설정을 다시 누르십시오.');
    }
    showForm();
  })();

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('btn');
    const p1 = document.getElementById('pw1').value;
    const p2 = document.getElementById('pw2').value;
    if (p1.length < 8) return say('⚠ 새 비밀번호는 8자 이상이어야 합니다.', 'error');
    if (p1 !== p2) return say('⚠ 두 칸의 비밀번호가 다릅니다. 같게 넣으십시오.', 'error');
    btn.disabled = true; say('바꾸는 중...');
    const { error } = await edmsClient.auth.updateUser({ password: p1 });
    if (error) {
      btn.disabled = false;
      const code = error.code || '';
      if (code === 'same_password' || /different from the old password/i.test(error.message || '')) return say('⚠ 전과 같은 비밀번호입니다. 다른 비밀번호를 넣으십시오.', 'error');
      if (code === 'weak_password') return say('⚠ 너무 쉬운 비밀번호입니다. 더 길게, 영문과 숫자를 섞어 넣으십시오.', 'error');
      return showDead('⚠ 새 비밀번호를 정하지 못했습니다. 로그인 화면에서 비밀번호 재설정을 다시 누르십시오.');
    }
    await edmsClient.auth.signOut();                  // 새 비밀번호로 다시 들어가게 함
    form.hidden = true;
    say('✔ 새 비밀번호를 정했습니다. 로그인 화면에서 새 비밀번호로 들어가십시오.', 'ok');
    toLogin.textContent = '로그인 화면으로';
    toLogin.hidden = false;
  });
</script>
</body>
</html>
