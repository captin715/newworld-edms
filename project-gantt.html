<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>간트 — 프로젝트관리 실앱 v1</title>
<!-- ★common.css 먼저, pm.css 나중 (지시 20260817_07 §A-4) — 겹치는 셀렉터는 pm.css 가 이깁니다.
     ★pm.css 에서는 공통과 겹치는 17개를 지웠으므로 남은 것은 pm 고유분입니다. -->
<link rel="stylesheet" href="common.css">
<link rel="stylesheet" href="pm.css">
</head>
<body>
<!-- ★header class="mk pm" — 프로젝트관리 화면 = 노랑 띠 + 먹색 글자(㉯ 확정 2026-08-11) -->
<header class="mk pm">
  <h1>프로젝트관리 시스템 <small>간트 (일정 · 임계경로) — 실앱 v1(읽기 전용)</small></h1>
  <div class="userbox">
    <span id="who">세션 확인 중…</span>
    <span class="role-badge" id="roleBadge">—</span>
    <a class="homebtn" href="project.html">대장</a>
  </div>
</header>
<main>
  <div class="mk-note" id="ribbon"></div>
  <div class="crumbs">프로젝트관리 시스템 &nbsp;›&nbsp; 프로젝트 대장 &nbsp;›&nbsp; <b>간트</b></div>

  <div id="state"></div>

  <div class="panel" id="panel" style="display:none">
    <h2 id="ttl">간트 <span class="float" id="mgmtTop"></span></h2>
    <div class="filters"><select id="pick"></select></div>
    <div id="banner"></div>
    <div class="gantt-wrap">
      <table class="gantt" id="gtTable">
        <thead><tr id="thead"></tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
    <div class="legend" id="legend"></div>
  </div>
</main>
<footer class="mk">프로젝트관리 실앱 v1 · 대기 구간을 노드로 잡습니다 · 조회 전용</footer>

<script src="assets/vendor/supabase.js"></script>
<script src="edms-config.js"></script>
<!-- ★common.js 신설 (지시 §A-4) — data-system="project" 헤더를 이것이 그립니다.
     ★boot() 를 그대로 씁니다 — 세션이 없으면 login.html 로 보냅니다(새로 짜지 않습니다 · C-51). -->
<script src="common.js"></script>
<script src="pmdata.js"></script>
<script>
var PROJECTS = [], CUR = null;

function dnum(s) { if (!s) return null; var p = String(s).split('-'); return Date.UTC(+p[0], +p[1] - 1, +p[2]) / 86400000; }
function dstr(n) { var d = new Date(n * 86400000); return d.getUTCFullYear() + '-' + String(d.getUTCMonth() + 1).padStart(2,'0') + '-' + String(d.getUTCDate()).padStart(2,'0'); }

async function draw(pc) {
  var tasks, miles;
  try {
    tasks = await pmFetchTasks(pc);
    miles = await pmFetchMilestones(pc);   /* ★0행이면 마일스톤 축을 그리지 않는다 */
  } catch (e) {
    document.getElementById('state').innerHTML = pmStateBox(pmIsAuthProblem(e) ? 'A' : 'B', e, '태스크');
    document.getElementById('panel').style.display = 'none';
    return;
  }
  document.getElementById('state').innerHTML = '';
  document.getElementById('panel').style.display = '';
  document.getElementById('ttl').innerHTML = '간트 — ' + pmEsc(pc)
    + ' <span class="float" id="mgmtTop"><span class="rec-lock">조회 전용</span></span>';

  var banner = document.getElementById('banner');

  /* ★B — 행이 아예 없는 프로젝트(7건 중 6건) */
  if (!tasks.length) {
    banner.innerHTML = '';
    document.getElementById('thead').innerHTML = '';
    document.getElementById('tbody').innerHTML = '';
    document.getElementById('legend').innerHTML = '';
    document.getElementById('state').innerHTML =
      '<div class="empty-state"><span class="ic">·</span>' + PM_MSG.B_EMPTY
      + ' — 아직 WBS 가 등재되지 않았습니다.<br>'
      + '<span style="font-size:12px">프로젝트는 대장에 있으나 <code>pm_tasks</code> 에 이 프로젝트 행이 0건입니다.</span></div>';
    return;
  }

  /* ── 임계 비율 — ★세기만 한다(게이트 통과 계산 아님) ── */
  var critN = tasks.filter(function (t) { return t.is_critical; }).length;
  var ratio = Math.round(critN / tasks.length * 100);
  var HIDE_CRIT_MARK = ratio > 90;   /* 90% 초과면 표식이 아무것도 구분하지 못한다 */

  /* ── 계획 축 — ★planned_* 가 전건 NULL 이면 계획 막대를 그릴 수 없다 ── */
  var nPlan = tasks.filter(function (t) { return t.planned_start || t.planned_end; }).length;

  /* ── 시간 축은 실적 날짜에서만 만든다. 날짜를 만들어 넣지 않는다 ── */
  var ds = [];
  tasks.forEach(function (t) {
    var a = dnum(t.actual_start), b = dnum(t.actual_end);
    if (a) ds.push(a); if (b) ds.push(b);
  });
  var hasAxis = ds.length > 0;
  var d0 = hasAxis ? Math.min.apply(null, ds) : null;
  var d1 = hasAxis ? Math.max.apply(null, ds) : null;
  var days = hasAxis ? Math.min(d1 - d0 + 1, 120) : 0;

  var msg = [];
  if (HIDE_CRIT_MARK)
    msg.push('<div class="banner crit"><b>전 구간 임계 — 여유 0</b> &nbsp; 임계 비율 <b>' + ratio + '%</b> ('
      + critN + ' / ' + tasks.length + '행). <b>90%를 넘어 임계 표식을 껐습니다.</b> '
      + '표식이 전 행에 붙으면 아무것도 구분하지 못합니다.</div>');
  else
    msg.push('<div class="banner warn"><b>지연 시 「위험」 자동 승격</b> — 임계 비율 ' + ratio + '% ('
      + critN + ' / ' + tasks.length + '행)</div>');
  /* ★C — 계획 값 미입력 */
  if (nPlan === 0)
    msg.push('<div class="banner info"><b>계획 ' + PM_MSG.C_DATE + '</b> — <code>planned_start</code>·<code>planned_end</code> 가 '
      + tasks.length + '행 <b>전건 미입력</b>입니다. <b>계획 막대를 그리지 않았습니다</b>(실적 막대만). '
      + '★날짜를 만들어 넣지 않습니다.</div>');
  if (!miles.length)
    msg.push('<div class="banner info"><b>마일스톤 축 없음</b> — <code>pm_milestones</code> 0행. 축을 만들어 내지 않았습니다.</div>');
  if (!hasAxis)
    msg.push('<div class="banner warn"><b>실적 날짜도 ' + PM_MSG.C_DATE + '</b> — 막대를 그릴 수 있는 날짜가 없어 표만 보입니다.</div>');
  banner.innerHTML = msg.join('');

  /* ── 표 머리 ── */
  var th = '<th style="width:70px">WBS</th><th style="width:230px">태스크</th>'
         + '<th style="width:60px">구간</th><th style="width:64px">게이트</th>';
  for (var i = 0; i < days; i++) th += '<th class="d">' + dstr(d0 + i).slice(5) + '</th>';
  document.getElementById('thead').innerHTML = th;

  /* ── 행 ── */
  var tb = '';
  tasks.forEach(function (t) {
    var wait = t.task_kind === '대기';
    tb += '<tr class="' + (wait ? 'waitrow' : '') + '">'
      + '<td class="lbl">' + pmVal(t.wbs) + '</td>'
      + '<td class="lbl' + (wait ? ' wrap' : '') + '">' + pmEsc(t.task_name)
      + (wait ? '<br><span class="wait-tag">' + pmVal(t.wait_kind) + ' · 대상 ' + pmVal(t.waiting_on) + '</span>' : '')
      + (!wait && t.is_critical && !HIDE_CRIT_MARK ? ' <span class="gate-mark">임계</span>' : '')
      + '</td>'
      + '<td class="lbl">' + pmVal(t.lifecycle_phase) + '</td>'
      + '<td class="lbl">' + (t.gate_code ? '<span class="gate-mark norm">' + pmEsc(t.gate_code) + '</span>' : pmVal(null)) + '</td>';
    var a = dnum(t.actual_start), b = dnum(t.actual_end);
    for (var j = 0; j < days; j++) {
      var day = d0 + j, bar = '';
      if (a && day === a) {
        var span = (b ? Math.min(b, d0 + days - 1) : a) - a + 1;
        bar = '<div class="bar ' + (wait ? 'bar-wait' : 'bar-work') + '" style="width:calc(' + span + '00% - 2px)"></div>';
      }
      tb += '<td class="cell">' + bar + '</td>';
    }
    tb += '</tr>';
  });
  document.getElementById('tbody').innerHTML = tb;

  document.getElementById('legend').innerHTML =
      '<span class="k"><span class="bar bar-work" style="position:static;display:inline-block;width:22px;height:10px"></span> 작업(실적)</span>'
    + '<span class="k"><span class="bar bar-wait" style="position:static;display:inline-block;width:22px;height:10px"></span> 대기(빗금) + 텍스트 병행</span>'
    + '<span class="k">계획 막대 <b>0개</b> — planned_* 전건 ' + PM_MSG.C_DATE + '</span>'
    + '<span class="k">정렬 = <code>sort_order</code> (wbs 문자열 정렬은 1.10 이 1.2 앞에 옵니다)</span>'
    + '<span class="k">대기 노드에는 공수를 넣지 않습니다 — 작업이 아니므로</span>';
}

(async function () {
  document.getElementById('ribbon').innerHTML =
    '<b>실앱(조회 전용)</b> — 편집 정책 미적용. 기준선 설정·태스크 관리는 아직 열려 있지 않습니다.';
  await pmFillSession();
  try {
    PROJECTS = await pmFetchProjects();
  } catch (e) {
    document.getElementById('state').innerHTML = pmStateBox(pmIsAuthProblem(e) ? 'A' : 'B', e, '프로젝트');
    return;
  }
  if (!PROJECTS.length) {
    document.getElementById('state').innerHTML = pmStateBox('B', null, '대장에 등재된 프로젝트');
    return;
  }
  var sel = document.getElementById('pick');
  sel.innerHTML = PROJECTS.map(function (p) {
    return '<option value="' + pmEsc(p.project_code) + '">' + pmEsc(p.project_code) + ' ' + pmEsc(p.project_name) + '</option>';
  }).join('');
  CUR = PROJECTS[0].project_code;
  sel.value = CUR;
  sel.addEventListener('change', function () { CUR = sel.value; draw(CUR); });
  document.getElementById('panel').style.display = '';
  await draw(CUR);
})();
</script>
</body>
</html>
