<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>문서양식 제정시스템 — 뉴월드 EDMS</title>
<link rel="stylesheet" href="common.css">
</head>
<body>
<header id="edmsHeader" data-system="establish"></header>
<main>
  <div id="loading" style="text-align:center;padding:60px 0;color:#5c2247">불러오는 중...</div>
  <div id="body" style="display:none"></div>
</main>
<footer style="text-align:center;padding:18px;font-size:11px;color:#aaa">문서양식 제정시스템 · 초안·검토중·승인대기 문서 · 데이터는 하나(edms_documents), 제정은 상태 전이</footer>

<script src="assets/vendor/supabase.js"></script>
<script src="edms-config.js"></script>
<script src="common.js"></script>
<script>
EDMS.ready.then(function (ctx) {
  if (!ctx) return;
  var ico = EDMS.ico, esc = EDMS.esc, escHtml = EDMS.escHtml, askReason = EDMS.askReason;
  var myRole = ctx.myRole, myId = ctx.session.user.id, isAdmin = ctx.isAdmin;
  var isExec = myRole === 'approver', isAuthor = myRole === 'reviewer';
  var canEst = myRole !== 'general';                 // 진입: 작성·검토 권한자
  var loading = document.getElementById('loading'), body = document.getElementById('body');
  loading.style.display = 'none'; body.style.display = '';

  if (!canEst) {
    body.innerHTML = '<div class="panel est"><div class="est-empty">' + ico('lock', '') + '<br>문서양식 제정시스템은 <b>작성·검토 권한자</b>만 진입할 수 있습니다.<br>미승인 초안을 다루므로 일반 부서원에게는 진입이 제한됩니다. (대문 타일은 노출)</div></div>';
    return;
  }

  var EST_STEPS = ['초안', '검토중', '승인대기', '등록완료'];
  function stepper(cur) {
    var idx = EST_STEPS.indexOf(cur);
    return '<div class="stepper">' + EST_STEPS.map(function (s, i) {
      var cls = i < idx ? 'done' : (i === idx ? 'on' : '');
      var ar = i < EST_STEPS.length - 1 ? '<span class="step-arrow">' + ico('arrowR') + '</span>' : '';
      return '<span class="step ' + cls + '"><span class="dot">' + (i + 1) + '</span><span class="lbl">' + s + (s === '등록완료' ? '(Rev)' : (s === '승인대기' ? '(Draft)' : '')) + '</span></span>' + ar;
    }).join('') + '</div>';
  }
  // edms_approvals 워크플로 상태 → 제정 스텝 라벨
  var STMAP = { '작성중': '초안', '검토중': '검토중', '승인대기': '승인대기', '보류': '검토중' };

  var allProfiles = [];
  var wfRows = [];

  async function loadEst() {
    // 진행 문서 = edms_approvals 미보관 진행건(작성중/검토중/승인대기/보류) — 실 워크플로 데이터(읽기)
    var r = await edmsClient.from('edms_approvals')
      .select('*, drafter:edms_profiles!drafter_id(name), reviewer:edms_profiles!reviewer_id(name), approver:edms_profiles!approver_id(name)')
      .in('status', ['작성중', '검토중', '승인대기', '보류']).order('created_at', { ascending: false }).limit(300);
    if (r.error) { console.warn('제정 진행목록 조회 실패:', r.error.message); wfRows = []; }
    else wfRows = r.data || [];
    render();
  }
  async function loadProfiles() {
    var r = await edmsClient.from('edms_profiles').select('id, name, email, role').order('email');
    allProfiles = r.data || [];
  }
  var nameOf = function (embed, id) { return (embed && embed.name) || (allProfiles.find(function (p) { return p.id === id; }) || {}).name || '—'; };

  function wfBtns(a) {
    var st = a.status;
    var canReview = st === '검토중' && (a.reviewer_id === myId || isAdmin);
    var canApprove = st === '승인대기' && (a.approver_id === myId || isAdmin);
    var b = '';
    if (st === '작성중' && a.drafter_id === myId) b += '<button class="est-btn primary" data-act="submit" data-id="' + a.id + '">' + ico('arrowR') + '검토 제출</button>';
    if (canReview) b += '<button class="est-btn primary" data-act="review-ok" data-id="' + a.id + '">관리자 검토 완료</button><button class="est-btn ghost" data-act="review-no" data-id="' + a.id + '">반려</button>';
    if (canApprove) b += '<button class="est-btn primary" data-act="approve-ok" data-id="' + a.id + '">' + ico('stamp') + '제정 승인(발번·Rev 1.00)</button><button class="est-btn ghost" data-act="approve-no" data-id="' + a.id + '">반려</button>';
    if (!b) b = '<span class="est-lock">' + ico('lock') + ' 해당 단계 권한자 처리 대기</span>';
    return b;
  }

  function render() {
    var listRows = wfRows.map(function (a) {
      var step = STMAP[a.status] || '초안';
      return '<tr><td>' + esc(a.doc_number || '(발번전)') + '</td><td>' + esc(a.title || '') + '</td><td>' + esc(a.approval_type || '') + '</td>'
        + '<td><span class="st st-' + step + '">' + step + (step === '승인대기' ? '(Draft)' : '') + '</span></td>'
        + '<td>' + esc(nameOf(a.drafter, a.drafter_id)) + '</td>'
        + '<td class="est-wf">' + wfBtns(a) + '</td></tr>';
    }).join('');
    var listPanel = wfRows.length
      ? '<table class="mini-tbl est" style="width:100%;border-collapse:collapse;font-size:13px"><thead><tr><th>문서번호</th><th>제목</th><th>구분</th><th>상태</th><th>작성</th><th>진행</th></tr></thead><tbody id="wfBody">' + listRows + '</tbody></table>'
      : '<div class="est-empty">진행 중인 초안이 없습니다. [초안 작성]으로 새 문서를 시작하세요.<br><small>(현행 데이터: 초안/검토중 0건 — 정본 290건은 문서관리 시스템에서 조회)</small></div>';

    body.innerHTML =
      '<div class="crumbs"><a href="index.html">뉴월드 EDMS</a><span class="sep">›</span><b>문서양식 제정시스템</b></div>'
      + '<div class="est-hint">제정 결재선: <b>작성 = 작성 권한자(품질팀장)</b> · <b>검토 = 관리자</b> · <b>승인 = 대표이사</b>. 각 단계 권한자만 전이 버튼이 활성화됩니다. 데이터는 하나이며 상태 전이(초안 → 검토중 → 승인대기 → 등록완료)로만 진행됩니다.</div>'
      + '<div class="est-actions">' + (isAuthor || isAdmin ? '<button class="est-btn primary" id="newDraft">' + ico('doc') + '초안 작성</button> <button class="est-btn primary" id="frOpen">' + ico('stamp') + '표준양식 생성</button>' : '<span class="est-lock">' + ico('lock') + ' 초안 작성·양식 생성은 작성 권한자·관리자</span>') + '</div>'
      + '<div class="panel est"><h2>' + ico('doc') + ' 진행 문서 (초안 · 검토중 · 승인대기)</h2>' + stepper('검토중') + listPanel
      + '<div class="ph-note" style="margin-top:10px;font-size:12px;color:#8894a8;background:#f6f8fc;border:1px dashed #cdd6e5;border-radius:8px;padding:12px 14px">이력 단절 방지: 초안 단계 검토·반려 이력(edms_approvals)은 제정(등록완료) 후 문서관리 시스템 이력에서도 조회됩니다. 상태만 전이되고 레코드는 하나입니다.</div></div>'
      + estFormGen();

    var nd = document.getElementById('newDraft'); if (nd) nd.addEventListener('click', openDraftForm);
    var fo = document.getElementById('frOpen'); if (fo) fo.addEventListener('click', function () { document.getElementById('frPanel').scrollIntoView({ behavior: 'smooth' }); });
    var wb = document.getElementById('wfBody'); if (wb) wb.addEventListener('click', onWf);
    frSync();
  }

  // ── 워크플로 전이 (기존 계약 RPC 사용 — 스키마 변경 없음) ──
  async function onWf(e) {
    var b = e.target.closest('[data-act]'); if (!b) return;
    var act = b.dataset.act, id = b.dataset.id; b.disabled = true;
    try {
      if (act === 'submit') { var r = await edmsClient.rpc('edms_apv_submit', { p_id: id }); if (r.error) return alert('제출 실패: ' + r.error.message); }
      else if (act === 'review-ok') { var r2 = await edmsClient.rpc('edms_apv_review', { p_id: id, p_approve: true, p_comment: null }); if (r2.error) return alert('처리 실패: ' + r2.error.message); }
      else if (act === 'approve-ok') { var r3 = await edmsClient.rpc('edms_apv_approve', { p_id: id, p_approve: true, p_comment: null }); if (r3.error) return alert('처리 실패: ' + r3.error.message); }
      else if (act === 'review-no' || act === 'approve-no') {
        var reason = await askReason(act === 'review-no' ? '검토 반려 사유' : '승인 반려 사유', '반려 사유를 입력해야 반려됩니다(필수).');
        if (reason === null) { b.disabled = false; return; }
        var rpc = act === 'review-no' ? 'edms_apv_review' : 'edms_apv_approve';
        var r4 = await edmsClient.rpc(rpc, { p_id: id, p_approve: false, p_comment: reason }); if (r4.error) return alert('처리 실패: ' + r4.error.message);
      }
      await loadEst();
    } finally { b.disabled = false; }
  }

  // ── 초안 작성(간이) — 기존 edms_apv_create + submit 사용 ──
  function openDraftForm() {
    var revs = allProfiles.filter(function (p) { return p.role === 'reviewer' || p.role === 'admin'; });
    var apps = allProfiles.filter(function (p) { return p.role === 'approver' || p.role === 'admin'; });
    var opt = function (list) { return list.map(function (p) { return '<option value="' + p.id + '">' + esc(p.name || p.email) + '</option>'; }).join(''); };
    var m = document.getElementById('draftModal');
    m.querySelector('#dfReviewer').innerHTML = opt(revs);
    m.querySelector('#dfApprover').innerHTML = opt(apps);
    ['dfNo', 'dfTitle', 'dfChange'].forEach(function (id) { m.querySelector('#' + id).value = ''; });
    m.querySelector('#dfMsg').textContent = '';
    m.classList.add('open');
  }

  function estFormGen() {
    // 표준양식(FR) 생성 — UI + 스텁 (실제 docx·발번대장 연동은 후속 과제 · 조건 h)
    return '<div class="panel est" id="frPanel"><h2>' + ico('stamp') + ' 표준양식(FR) 생성 <span class="tag-fr">신규 · UI+스텁</span></h2>'
      + '<div class="est-hint">문서작성지침 <b>W-GL-G051000</b> 기반 표준양식(W-FR) docx 제작. 실제 docx 산출·발번대장 연동은 <b>후속 과제</b>이며 현재는 미리보기·접수까지만 동작합니다(승인 없는 선구현 금지).</div>'
      + '<div class="est-grid"><div><label>기반(상위) 문서번호</label><input class="est-inp" id="frBase" value="W-QS-Q030000"></div>'
      + '<div><label>계층코드</label><select class="est-inp" id="frLayer"><option value="P">P (절차서 예하)</option><option value="L">L (지침서 예하)</option><option value="S">S (작업표준서 예하)</option><option value="Q">Q (검사기준서 예하)</option><option value="I">I (작업지침서 예하)</option></select></div></div>'
      + '<div class="est-grid"><div><label>양식명</label><input class="est-inp" id="frName" value="수입검사 성적서 양식"></div>'
      + '<div><label>양식번호(자동)</label><input class="est-inp" id="frNo" readonly></div></div>'
      + '<label class="est-sec" style="display:block">양식 미리보기 (docx 뼈대)</label><div class="form-preview" id="frPreview"></div>'
      + '<div class="est-actions" style="margin-top:12px"><button class="est-btn primary" id="frMake">' + ico('stamp') + '표준양식 생성(스텁)</button></div>'
      + '<div id="frMsg" style="font-size:12px;margin-top:8px;min-height:16px;color:#2e7d32"></div></div>';
  }
  function frSync() {
    var base = (document.getElementById('frBase') || {}).value || '';
    var layer = (document.getElementById('frLayer') || {}).value || 'P';
    var core = (base.match(/([A-Z]\d{6})/) || [, 'G000000'])[1];
    var no = 'W-FR-' + layer + '-' + core + '-01';
    var noEl = document.getElementById('frNo'); if (noEl) noEl.value = no;
    var pv = document.getElementById('frPreview');
    if (pv) pv.innerHTML = '<div class="doc-title">' + esc((document.getElementById('frName') || {}).value || '(양식명)') + '</div>'
      + '문서번호: ' + esc(no) + '<br>기반 문서: ' + esc(base) + '<br>제·개정일: (발번 시 확정) · 보안등급: P2'
      + '<hr style="border:none;border-top:1px dashed #d9c6d2;margin:8px 0">[표준 머리말: 회사명·문서번호·Rev·페이지]<br>[본문 표: 항목 | 기준 | 판정 | 비고]<br>[표준 꼬리말: 작성·검토·승인 서명란]';
  }
  document.addEventListener('input', function (e) { if (['frBase', 'frLayer', 'frName'].indexOf(e.target.id) >= 0) frSync(); });
  document.addEventListener('click', function (e) {
    if (e.target.closest && e.target.closest('#frMake')) {
      var msg = document.getElementById('frMsg');
      // TODO(후속): 실제 docx 생성·발번대장 연동은 별도 승인 후 구현(조건 h). 현재 스텁.
      msg.textContent = '표준양식 생성 요청 접수: ' + (document.getElementById('frNo') || {}).value + ' (docx 산출·발번 연동은 후속 과제 — 현재 DB/스토리지 변경 없음).';
    }
  });

  // 초안 작성 모달 주입
  (function injectDraftModal() {
    var html = '<div id="draftModal" style="display:none;position:fixed;inset:0;z-index:1300;background:rgba(15,25,45,.6);padding:5vh 4vw;overflow:auto"><div style="background:#fff;border-radius:12px;max-width:560px;margin:0 auto;box-shadow:0 18px 60px rgba(0,0,0,.4)">'
      + '<div style="background:#7a2e5e;color:#fff;padding:13px 18px;border-radius:12px 12px 0 0;display:flex;justify-content:space-between;align-items:center"><h3 style="font-size:15px">초안 작성 · 검토 제출</h3><button class="nav-btn" id="dfClose">닫기</button></div>'
      + '<div style="padding:18px" class="est-grid"><div style="grid-column:1/3"><label>문서번호(발번 전 임시 가능)</label><input class="est-inp" id="dfNo" placeholder="예: W-P-C050000"></div>'
      + '<div style="grid-column:1/3"><label>제목 <b style="color:#c0392b">*</b></label><input class="est-inp" id="dfTitle" placeholder="문서 제목"></div>'
      + '<div><label>보안등급</label><select class="est-inp" id="dfSecurity"><option value="1">P1</option><option value="2" selected>P2</option><option value="3">P3</option><option value="4">P4</option></select></div>'
      + '<div><label>버전(자동)</label><input class="est-inp" id="dfVer" value="Ver 0.1" readonly></div>'
      + '<div><label>검토자(관리자)</label><select class="est-inp" id="dfReviewer"></select></div>'
      + '<div><label>승인자(대표이사)</label><select class="est-inp" id="dfApprover"></select></div>'
      + '<div style="grid-column:1/3"><label>제·개정 사유 <b style="color:#c0392b">*</b></label><textarea class="est-inp" id="dfChange" style="min-height:56px"></textarea></div>'
      + '<div style="grid-column:1/3"><div class="est-hint">발번·Rev는 제정 승인 시 확정됩니다. 이 화면은 초안 등록 후 검토 제출(edms_apv_create → submit)까지 수행합니다.</div></div>'
      + '<div style="grid-column:1/3"><button class="est-btn primary" id="dfSubmit">초안 등록 + 검토 제출</button><span id="dfMsg" style="font-size:12px;margin-left:8px"></span></div>'
      + '</div></div></div>';
    var d = document.createElement('div'); d.innerHTML = html; document.body.appendChild(d);
    document.getElementById('dfClose').addEventListener('click', function () { document.getElementById('draftModal').classList.remove('open'); });
    document.getElementById('dfSubmit').addEventListener('click', doDraftSubmit);
  })();
  document.getElementById('draftModal').style.display = 'none';
  var dm = document.getElementById('draftModal');
  var st = document.createElement('style'); st.textContent = '#draftModal.open{display:block!important}'; document.head.appendChild(st);

  async function doDraftSubmit() {
    var m = document.getElementById('draftModal'), msg = m.querySelector('#dfMsg');
    var title = m.querySelector('#dfTitle').value.trim(), change = m.querySelector('#dfChange').value.trim();
    var no = m.querySelector('#dfNo').value.trim() || ('DRAFT-' + Date.now());
    if (!title || !change) { msg.style.color = '#c0392b'; msg.textContent = '제목·사유는 필수입니다.'; return; }
    var btn = m.querySelector('#dfSubmit'); btn.disabled = true; msg.style.color = '#555'; msg.textContent = '처리 중…';
    try {
      var c = await edmsClient.rpc('edms_apv_create', {
        p_type: '제정', p_doc_number: no, p_title: title, p_series: '', p_doc_type: '', p_security: parseInt(m.querySelector('#dfSecurity').value, 10),
        p_version: 'Ver 0.1', p_change: change, p_document_id: null, p_reviewer: m.querySelector('#dfReviewer').value || myId,
        p_approver: m.querySelector('#dfApprover').value || myId, p_storage_path: null, p_read_scope: 'all'
      });
      if (c.error || !c.data) { msg.style.color = '#c0392b'; msg.textContent = '작성 실패: ' + (c.error ? c.error.message : 'id 미반환'); return; }
      var s = await edmsClient.rpc('edms_apv_submit', { p_id: c.data });
      if (s.error) { msg.style.color = '#c0392b'; msg.textContent = '상신 실패: ' + s.error.message; return; }
      m.classList.remove('open'); await loadEst();
    } finally { btn.disabled = false; }
  }

  loadProfiles().then(loadEst);
});
</script>
</body>
</html>
