<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>뉴월드 EDMS — 대문</title>
<link rel="stylesheet" href="common.css">
</head>
<body>
<header id="edmsHeader" data-system="gate"></header>
<main>
  <div id="loading" style="text-align:center;padding:60px 0;color:#26324a">불러오는 중...</div>
  <div id="gate" style="display:none">
    <div class="crumbs"><b>뉴월드 EDMS</b><span class="sep">›</span>대문</div>
    <div class="gate-hero">
      <div class="top">NEWWORLD EDMS</div>
      <h1>뉴월드 EDMS</h1>
      <p>이용하실 시스템을 선택하세요. 세 시스템은 <b>하나의 데이터(문서 1건 = 1레코드)</b>를 공유하며, 제정은 이관이 아니라 <b>상태 전이</b>입니다. 로그인 세션은 전환 시 유지됩니다.</p>
    </div>
    <div class="gate-tiles" id="tiles"></div>
    <div class="gate-info" id="info"></div>
  </div>
</main>
<footer style="text-align:center;padding:18px;font-size:11px;color:#aaa">뉴월드 EDMS · 문서관리 · 기록관리 · 문서양식 제정 · 접속 주소(루트)는 이 대문으로 연결됩니다.</footer>

<script src="assets/vendor/supabase.js"></script>
<script src="edms-config.js"></script>
<script src="common.js"></script>
<script>
  EDMS.ready.then(function (ctx) {
    if (!ctx) return;  // 미로그인 → common.js가 login.html로 이동
    document.getElementById('loading').style.display = 'none';
    document.getElementById('gate').style.display = '';
    var ico = EDMS.ico, esc = EDMS.esc, SYS = EDMS.SYS;
    var role = ctx.myRole;
    var canEst = role !== 'general';  // 제정: 작성·검토 권한자만(일반 제외)

    function tile(key, desc) {
      var m = SYS[key];
      return '<a class="gate-tile ' + m.cls + '" href="' + m.file + '"><span class="t-ico">' + ico(m.icon) + '</span>'
        + '<div class="t-title">' + m.name + '</div><div class="t-desc">' + desc + '</div>'
        + '<div class="t-go">' + ico('arrowR') + ' 들어가기</div></a>';
    }
    var estTile = canEst
      ? tile('establish', '초안 작성~검토~발번~제정, 표준양식(FR) 생성 — 초안·검토중·승인대기 문서')
      : '<div class="gate-tile est locked"><span class="t-lock">' + ico('lock') + ' 권한 필요</span><span class="t-ico">' + ico('stamp') + '</span>'
        + '<div class="t-title">문서양식 제정시스템</div><div class="t-desc">미승인 초안을 다루므로 <b>작성·검토 권한자</b>만 진입할 수 있습니다. (타일은 노출, 진입만 제한)</div>'
        + '<div class="t-go">' + ico('lock') + ' 진입 권한 없음</div></div>';

    document.getElementById('tiles').innerHTML =
      tile('docs', '제정 문서 열람·다운로드·배포·개정 — 등록완료 문서(·폐기 조회)')
      + tile('records', '부서별 관리함 기록 등재·열람·배포 — 기록보관소·배포대장')
      + estTile;

    document.getElementById('info').innerHTML =
      '<div class="gate-card docs"><div class="label">문서관리 · 접속</div><div class="value">전원</div></div>'
      + '<div class="gate-card recs"><div class="label">기록관리 · 접속</div><div class="value">전원</div></div>'
      + '<div class="gate-card est"><div class="label">문서양식 제정 · 접속</div><div class="value">' + (canEst ? '가능' : '권한 필요') + '</div></div>';
  });
</script>
</body>
</html>
