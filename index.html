<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>뉴월드 EDMS — 대문</title>
<link rel="stylesheet" href="common.css">
</head>
<body>
<header id="edmsHeader" data-system="gate"></header>
<main>
  <div id="loading" style="text-align:center;padding:60px 0;color:#26324a">불러오는 중...</div>
  <div id="gate" style="display:none">
    <div class="crumbs"><b>뉴월드 EDMS</b><span class="sep">›</span>대문</div>
    <div class="gate-hero">
      <div class="top">NEWWORLD EDMS</div>
      <h1>뉴월드 EDMS</h1>
      <p>이용하실 영역을 선택하세요. <b>문서관리</b>는 표준문서의 제정·개정·열람을, <b>기록관리</b>는 승인된 양식으로 남기는 기록의 등재·보관·배포를 다룹니다. 두 영역은 <b>하나의 데이터</b>를 공유하며 로그인 세션은 전환 시 유지됩니다.</p>
    </div>
    <div class="gate-tiles" id="tiles"></div>
    <div class="gate-info" id="info"></div>
  </div>
</main>
<footer style="text-align:center;padding:18px;font-size:11px;color:#aaa">뉴월드 EDMS · 문서관리 · 기록관리 · 접속 주소(루트)는 이 대문으로 연결됩니다.</footer>

<script src="assets/vendor/supabase.js"></script>
<script src="edms-config.js"></script>
<script src="common.js"></script>
<script>
  // 대문 2단 개편(지시 20260802_05) — 3타일 평면 → 2카드(문서관리·기록관리) → 서브 대문
  //   권한 분기는 대문에서 제거하고 docs-gate.html 로 이동한다(지시 §4).
  EDMS.ready.then(function (ctx) {
    if (!ctx) return;  // 미로그인 → common.js가 login.html로 이동
    document.getElementById('loading').style.display = 'none';
    document.getElementById('gate').style.display = '';
    var ico = EDMS.ico;

    function area(cls, icon, name, file, desc) {
      return '<a class="gate-tile ' + cls + '" href="' + file + '"><span class="t-ico">' + ico(icon) + '</span>'
        + '<div class="t-title">' + name + '</div><div class="t-desc">' + desc + '</div>'
        + '<div class="t-go">' + ico('arrowR') + ' 들어가기</div></a>';
    }

    document.getElementById('tiles').innerHTML =
      area('docs', 'doc', '문서관리', 'docs-gate.html',
           '표준문서의 제정·개정·열람·배포 — <b>문서관리시스템</b>과 <b>문서양식 제정시스템</b>')
      + area('recs', 'archive', '기록관리', 'records-gate.html',
           '승인된 양식으로 남기는 기록 — <b>기록관리시스템</b>과 <b>기록작성시스템</b>');

    document.getElementById('info').innerHTML =
      '<div class="gate-card docs"><div class="label">문서관리 · 접속</div><div class="value">전원</div></div>'
      + '<div class="gate-card recs"><div class="label">기록관리 · 접속</div><div class="value">전원</div></div>';
  });
</script>
</body>
</html>
